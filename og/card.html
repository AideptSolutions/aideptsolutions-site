<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AiDept Solutions OG card source</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;1,8..60,400&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper: #ffffff; --ink: #0a1628; --ink-2: #3d4756; --ink-3: #7b8594; --rule: #dde2e8; --accent: #b7791f; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  body { font-family: 'Source Sans 3', Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; padding: 56px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-weight: 500; font-variation-settings: "opsz" 40; letter-spacing: -0.01em; }
  .brand img { width: 40px; height: 43px; }
  h1 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 500; font-size: 84px; line-height: 1.02; letter-spacing: -0.012em; font-variation-settings: "opsz" 60; max-width: 900px; text-wrap: balance; }
  h1 em { font-style: italic; font-weight: 400; color: var(--accent); }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--ink); padding-top: 22px; }
  .foot .url { font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-variation-settings: "opsz" 40; }
  .foot .facts { display: flex; gap: 36px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .foot .facts b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="/favicon.svg" alt=""> AiDept Solutions</div>
  <h1>We build web products and <em>keep running them</em> after launch.</h1>
  <div class="foot">
    <div class="url">aideptsolutions.com</div>
    <div class="facts"><span><b>7</b> live products</span><span>Build, operate, advise</span><span>United States</span></div>
  </div>
</div>
</body>
</html>
